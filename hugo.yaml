baseURL: "https://www.shivamtiwari.si/"
languageCode: "en-us"
title: "Shivam Tiwari"
theme: "PaperMod"

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true
pygmentsUseClasses: true
mainsections: ["posts"]

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production
  title: "Shivam Tiwari"
  description: "AI Product leader shipping agentic AI and conversational systems at consumer scale. Ex-Lenskart, Founder of Apli.ai (acquired)."
  keywords:
    - Shivam Tiwari
    - AI Product Manager
    - Agentic AI
    - LLM
    - Product Management
    - Abu Dhabi
    - Lenskart
    - The Good Bug
  author: "Shivam Tiwari"

  DateFormat: "January 2, 2006"
  defaultTheme: dark
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: false
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: true
  tocopen: false

  assets:
    disableHLJS: true
    favicon: "images/favicon.ico"
    favicon16x16: "images/favicon-16x16.png"
    favicon32x32: "images/favicon-32x32.png"
    apple_touch_icon: "images/favicon-180x180.png"
    safari_pinned_tab: "images/favicon.svg"
    theme_color: "#0a0a0d"

  # Site-wide social share image (og:image / twitter:image)
  images:
    - "images/og.png"

  profileMode:
    enabled: true
    title: "Shivam Tiwari"
    subtitle: "Head of Product & AI · Building agentic AI for consumer health · Ex-Lenskart · Founder @ Apli (acquired) · Google AI Instructor"
    imageUrl: "/images/profile.png"
    imageWidth: 180
    imageHeight: 180
    imageTitle: "Shivam Tiwari"
    buttons:
      - name: About
        url: /about/
      - name: Experience
        url: /experience/
      - name: Projects
        url: /projects/
      - name: Writing
        url: /posts/
      - name: Research & Speaking
        url: /research/

  socialIcons:
    - name: linkedin
      url: "https://www.linkedin.com/in/shivamtiwariin/"
    - name: github
      url: "https://github.com/shivamtiwari3"
    - name: x
      url: "https://x.com/shivamtiwariin"
    - name: googlescholar
      url: "https://scholar.google.com/citations?user=b-OtBPkAAAAJ"
    - name: email
      url: "mailto:iitb.shivam@gmail.com"

  label:
    text: "Shivam Tiwari"
    icon: ""
    iconHeight: 35
    signature: "images/signature.png"
    signatureHeight: 44

  editPost:
    disabled: true

menu:
  main:
    - identifier: about
      name: About
      url: /about/
      weight: 10
    - identifier: experience
      name: Experience
      url: /experience/
      weight: 20
    - identifier: projects
      name: Projects
      url: /projects/
      weight: 30
    - identifier: research
      name: Research & Speaking
      url: /research/
      weight: 40
    - identifier: writing
      name: Writing
      url: /posts/
      weight: 50

outputs:
  home:
    - HTML
    - RSS
    - JSON

pagination:
  pagerSize: 10
